# This workflow runs benchmark
# Separation of jobs helps to cache data even benchmark is fail

name: Benchmark

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:

  # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #

  download_data:

    runs-on: ubuntu-latest

    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4 - 2026.05.21
        with:
          egress-policy: audit

      - name: Checkout CredData
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 - 2026.06.18
        with:
          repository: Samsung/CredData
          ref: c09c0c52fc6dae4ae5438ae69ba486f9f8059f0d

      - name: Markup hashing
        run: |
          md5sum snapshot.json >checksums.md5
          for f in $(find meta -type f|sort); do md5sum $f; done >>checksums.md5
          for f in $(find . -maxdepth 1 -type f -name "*.py"|sort); do md5sum $f; done >>checksums.md5
          cat checksums.md5
          sha256sum checksums.md5

      - name: Cache data
        id: cache-data
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3 - 2026.01.29
        with:
          path: data
          key: cred-data-${{ hashFiles('checksums.md5') }}

      - name: Set up Python 3.10
        if: steps.cache-data.outputs.cache-hit != 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 - 2026.06.24
        with:
          python-version: "3.10"

      - name: Update PIP
        run: python -m pip install --upgrade pip

      - name: Install requirements of CredData
        if: steps.cache-data.outputs.cache-hit != 'true'
        run: python -m pip install --requirement requirements.txt

      - name: Generate Data Asset
        if: steps.cache-data.outputs.cache-hit != 'true'
        run: python download_data.py --data_dir data --jobs $(nproc)


  # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #

  # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #

  performance_benchmark:
    # put the benchmark in single job to keep constant environment during test
    needs: [ download_data ]

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]

    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4 - 2026.05.21
        with:
          egress-policy: audit

      - name: Checkout CredData
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 - 2026.06.18
        with:
          repository: Samsung/CredData
          ref: c09c0c52fc6dae4ae5438ae69ba486f9f8059f0d

      - name: Markup hashing
        run: |
          md5sum snapshot.json >checksums.md5
          for f in $(find meta -type f|sort); do md5sum $f; done >>checksums.md5
          for f in $(find . -maxdepth 1 -type f -name "*.py"|sort); do md5sum $f; done >>checksums.md5
          cat checksums.md5
          sha256sum checksums.md5

      - name: Cache data
        id: cache-data
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3 - 2026.01.29
        with:
          path: data
          key: cred-data-${{ hashFiles('checksums.md5') }}

      - name: Failure in case when cache missed
        if: steps.cache-data.outputs.cache-hit != 'true'
        run: exit 1

      - name: Exclude very huge data
        if: steps.cache-data.outputs.cache-hit == 'true'
        run: rm -rf data/0* data/2* data/7* data/8* data/a* data/b* data/d* data/e* data/f*

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 - 2026.06.24
        with:
          python-version: ${{ matrix.python-version }}

      - name: Add synthetic huge data
        if: steps.cache-data.outputs.cache-hit == 'true'
        run: python -c "for n in range(7654321):print(f'{n:08x}')" >data/test.text

      - name: Update PIP
        run: python -m pip install --upgrade pip

      - name: Install released CredSweeper
        run: |
          python -m pip install credsweeper
          # check the banner
          credsweeper --banner

      - name: Run performance benchmark RELEASE
        run: |
          START_TIME=$(date +%s)
          # todo: apply ``--ml_threads_limit $(nproc)`` after release
          /usr/bin/time --verbose credsweeper --jobs $(nproc) --log error --path data --no-stdout --save-json /dev/null
          FINISH_TIME=$(date +%s)
          RELEASE_TIME=$(( ${FINISH_TIME} - ${START_TIME} ))
          if [ 0 -lt ${RELEASE_TIME} ]; then
            echo Elapsed $(date -ud "@${RELEASE_TIME}" +"%H:%M:%S")
          else
            echo "Wrong result '${RELEASE_TIME}'"
            exit 1
          fi
          echo "RELEASE_TIME=${RELEASE_TIME}" >> $GITHUB_ENV

      - name: Checkout base CredSweeper
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 - 2026.06.18
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: temp/CredSweeper.base

      - name: Install base CredSweeper
        run: |
          python -m pip uninstall -y credsweeper
          python -m pip install temp/CredSweeper.base
          # check the banner
          credsweeper --banner

      - name: Run performance benchmark BASE
        run: |
          START_TIME=$(date +%s)
          # todo: apply ``--ml_threads_limit $(nproc)`` after merge
          /usr/bin/time --verbose credsweeper --jobs $(nproc) --log error --path data --no-stdout --save-json /dev/null
          FINISH_TIME=$(date +%s)
          BASE_TIME=$(( ${FINISH_TIME} - ${START_TIME} ))
          if [ 0 -lt ${BASE_TIME} ]; then
            echo Elapsed $(date -ud "@${BASE_TIME}" +"%H:%M:%S")
          else
            echo "Wrong result '${BASE_TIME}'"
            exit 1
          fi
          echo "BASE_TIME=${BASE_TIME}" >> $GITHUB_ENV

      - name: Checkout current CredSweeper
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 - 2026.06.18
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: temp/CredSweeper.head

      - name: Install current CredSweeper
        run: |
          python -m pip uninstall -y credsweeper
          python -m pip install temp/CredSweeper.head
          # check the banner
          credsweeper --banner

      - name: Run performance benchmark CURRENT
        run: |
          START_TIME=$(date +%s)
          /usr/bin/time --verbose credsweeper --jobs $(nproc) --ml_threads_limit $(nproc) --log error --path data --no-stdout --save-json /dev/null
          FINISH_TIME=$(date +%s)
          HEAD_TIME=$(( ${FINISH_TIME} - ${START_TIME} ))
          if [ 0 -lt ${HEAD_TIME} ]; then
            echo Elapsed $(date -ud "@${HEAD_TIME}" +"%H:%M:%S")
          else
            echo "Wrong result '${HEAD_TIME}'"
            exit 1
          fi
          echo "HEAD_TIME=${HEAD_TIME}" >> $GITHUB_ENV

      - name: Compare results
        run: |
          exit_code=0
          LOW_DELTA=100
          THRESHOLD=2500

          # RELEASE
          if [ ${RELEASE_TIME} -le ${HEAD_TIME} ]; then
            d=$(( 10000 * ( ${HEAD_TIME} - ${RELEASE_TIME} ) / ${RELEASE_TIME} ))
            python -c "print(f'RELEASE_TIME = ${RELEASE_TIME} sec, HEAD_TIME = ${HEAD_TIME} sec, diff: {$d/100:.2f} %')"
            if [ $LOW_DELTA -ge ${d} ]; then
              echo "Almost the same."
            elif [ $THRESHOLD -lt ${d} ]; then
              echo "Significantly Slowdown."
              exit_code=1
            else
              echo "Slowdown."
            fi
          else
            d=$(( 10000 * ( ${RELEASE_TIME} - ${HEAD_TIME} ) / ${RELEASE_TIME} ))
            python -c "print(f'RELEASE_TIME = ${RELEASE_TIME} sec, HEAD_TIME = ${HEAD_TIME} sec, diff: {$d/100:.2f} %')"
            if [ $LOW_DELTA -ge ${d} ]; then
              echo "Almost the same."
            elif [ $THRESHOLD -lt ${d} ]; then
              echo "Significantly speed-up."
            else
              echo "Speed-up."
            fi
          fi

          # BASE
          if [ ${BASE_TIME} -le ${HEAD_TIME} ]; then
            d=$(( 10000 * ( ${HEAD_TIME} - ${BASE_TIME} ) / ${BASE_TIME} ))
            python -c "print(f'BASE_TIME = ${BASE_TIME} sec, HEAD_TIME = ${HEAD_TIME} sec, diff: {$d/100:.2f} %')"
            if [ $LOW_DELTA -ge ${d} ]; then
              echo "Almost the same."
            elif [ $THRESHOLD -lt ${d} ]; then
              echo "Significantly Slowdown."
              exit_code=1
            else
              echo "Slowdown."
            fi
          else
            d=$(( 10000 * ( ${BASE_TIME} - ${HEAD_TIME} ) / ${BASE_TIME} ))
            python -c "print(f'BASE_TIME = ${BASE_TIME} sec, HEAD_TIME = ${HEAD_TIME} sec, diff: {$d/100:.2f} %')"
            if [ $LOW_DELTA -ge ${d} ]; then
              echo "Almost the same."
            elif [ $THRESHOLD -lt ${d} ]; then
              echo "Significantly speed-up."
            else
              echo "Speed-up."
            fi
          fi

          exit ${exit_code}

      - name: Interrupt check
        run: |
          cp -v temp/CredSweeper.head/tests/log.yaml log.yaml
          sed -i 's/TRACE/DEBUG/g' log.yaml
          rm -fr log
          mkdir log
          (time if ! (timeout --signal=SIGINT 10s python -m credsweeper --banner --jobs 2 --path data --log debug --log_config log.yaml --progress &>./log/console.log); then echo FINISHED; fi) &
          test_pid=$!
          probes=5
          while [ 0 -lt $probes ]; do
            probes=$(( $probes - 1 ))
            ps -efww | grep -E "\s$test_pid\s" || true
            if kill -0 $test_pid; then
              echo "Process $test_pid alive # $probes"
            else
              echo "Process $test_pid dead # $probes"
              break
            fi
            echo "Sleep 7 seconds"
            sleep 7
          done
          echo "Probes out"
          if ! [ 0 -lt $probes ]; then
            echo "Overtime"
            exit 1
          fi
          wait

          if ps -efww | grep -E "^\w+\s+\w+\s+$test_pid\s"; then
            echo "Child processes exist"
            exit 1
          fi

          # check log from a worker
          grep -E '\| DEBUG \| SpawnPoolWorker' ./log/debug.log | head -n 1
          grep -E '\| INFO \| SpawnPoolWorker' ./log/console.log | head -n 1
          grep -E '\| WARNING \| MainProcess:MainThread \| app.py:.* \| Interrupted' ./log/warning.log
          grep -E '\| WARNING \| MainProcess:MainThread \| app.py:.* \| Interrupted' ./log/console.log

          echo "Test interrupt passed"

      - name: Upload CredSweeper log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 - 2026.04.10
        with:
          name: log-${{ matrix.python-version }}
          path: log

  # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
