---

version: 1

disable_existing_loggers: False

ignore: [git, pdfminer]

formatters:
    simple:
        format: "%(asctime)s | %(levelname)s | %(processName)s:%(threadName)s | %(filename)s:%(lineno)d | %(message)s"
    verbose:
        format: "%(asctime)s | %(levelname)s | %(processName)s:%(threadName)s | %(name)s | %(filename)s:%(lineno)d | %(message)s"

handlers:
    console:
        class: logging.StreamHandler
        level: INFO
        formatter: simple
        stream: ext://sys.stdout

    debug:
        class: logging.handlers.TimedRotatingFileHandler
        level: DEBUG
        formatter: verbose
        filename: ./log/debug.log
        backupCount: 3
        delay: True
        when: midnight

    error:
        class: logging.handlers.RotatingFileHandler
        level: ERROR
        formatter: verbose
        filename: ./log/error.log
        maxBytes: 1048576
        backupCount: 7

root:
    level: NOTSET
    handlers: [console]
